    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 8%;
            background: var(--marfil);
        }

        .thank-you-content {
            max-width: 700px;
        }

        .thank-you-eyebrow {
            color: var(--dorado-oscuro);
            font-size: 0.72rem;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .thank-you-content h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 500;
            line-height: 1;
            color: var(--negro);
            margin-bottom: 30px;
        }

        .thank-you-content p {
            max-width: 580px;
            margin: 0 auto 40px;
            color: #555;
            font-size: 1rem;
            line-height: 1.8;
        }

        .thank-you-button {
            display: inline-block;
            background: var(--negro);
            color: var(--blanco);
            padding: 18px 32px;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            transition: 0.3s;
        }

        .thank-you-button:hover {
            background: var(--dorado);
            color: var(--negro);
        }
    </style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    if (sessionStorage.getItem("du-lead-submitted") !== "1") return;
    sessionStorage.removeItem("du-lead-submitted");
    if (localStorage.getItem("digital-ukhti-analytics-consent") === "accepted" && typeof window.gtag === "function") {
        window.gtag("event", "generate_lead");
    }
});
</script>
